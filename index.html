<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Temir Games Studio</title>

    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            background: #080d17;
            color: #ffffff;
            font-family: Arial, sans-serif;
        }

        .container {
            text-align: center;
            padding: 30px;
        }

        h1 {
            font-size: clamp(36px, 7vw, 72px);
            margin-bottom: 15px;
        }

        p {
            font-size: 18px;
            color: #9ba7b7;
        }

        .accent {
            color: #27d9ff;
        }
    </style>
</head>

<body>

    <main class="container">
        <h1>TEMIR GAMES <span class="accent">STUDIO</span></h1>
        <p>Independent Game Studio</p>
    </main>

</body>
</html>
